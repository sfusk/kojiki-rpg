# GitHub Pages への公開。テストが通ったときだけ配信する。
# 権限は既定の read から必要なぶんだけ引き上げている（最小権限）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らせない（後から来たものを優先し、古い実行は打ち切る）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 配信するのは遊ぶのに要るファイルだけ。テスト・開発サーバー・依存は含めない
      - name: 配信ファイルを集める
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
